name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check syntax
        run: |
          node --check cli/bin/chiron-enhance.mjs
          node --check cli/src/enhancer.mjs
          node --check cli/src/context-engine.mjs
